[project]
name = "Nuitka"
dynamic = ["version"]
description = "Python compiler with full language support and CPython compatibility"
readme = { file = "doc/README.rst", content-type = "text/x-rst" }
requires-python = ">=2.7"
dependencies = [
    "appdirs",
    "jinja2>=2.10.2",
    "pyyaml ; python_full_version == '2.7.*' or python_full_version >= '3.6'",
    "subprocess32 ; python_full_version == '2.7.*'",
    "tqdm ; python_full_version == '2.7.*' or python_full_version >= '3.4'",
    "zstandard>=0.15 ; python_full_version >= '3.5' and python_full_version < '3.14'",
]

[build-system]
requires = ["setuptools>=42", "wheel"]

[tool.uv]
package = false

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"

reportAttributeAccessIssue = "none"
reportMissingModuleSource = "none"
reportMissingImports = "none"

reportOptionalMemberAccess = "none"
reportOptionalCall = "none"
reportOptionalSubscript = "none"
reportOptionalIterable = "none"
reportOptionalOperand = "none"

reportArgumentType = "none"
reportAssignmentType = "none"
reportCallIssue = "none"
reportOperatorIssue = "none"
reportGeneralTypeIssues = "none"

reportRedeclaration = "none"
reportPrivateImportUsage = "none"

exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "**/inline_copy/**",
    "*Mini*",
]

[tool.ruff]
builtins = ["__compiled__", "cmp", "intern", "unicode", "long"]
lint.ignore = ["E402", "E731", "F401"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "**/inline_copy/**",
    "*Mini*",
]

[dependency-groups]
dev = [
    "astroid==4.0.4 ; python_full_version >= '3.11'",
    "black==26.3.1 ; python_full_version >= '3.11'",
    "clang-format==22.1.1",
    "codespell==2.4.2 ; python_full_version >= '3.11'",
    "deepdiff==8.6.2 ; python_full_version >= '3.11'",
    "doxypypy==0.8.8.6 ; python_full_version >= '2.7'",
    "isort==8.0.1 ; python_full_version >= '3.11'",
    "jinja2==2.11.3 ; python_full_version == '2.7.*'",
    "jinja2==3.1.4 ; python_full_version >= '3.7'",
    "jsonschema==4.6.0 ; python_full_version >= '3.7'",
    "mdformat==1.0.0 ; python_full_version >= '3.11'",
    "mdformat-footnote==0.1.3 ; python_full_version >= '3.11'",
    "mdformat-frontmatter==2.0.10 ; python_full_version >= '3.11'",
    "mdformat-gfm==1.0.0 ; python_full_version >= '3.11'",
    "pip<21.0 ; python_full_version == '2.7.*'",
    "pygments==2.20.0 ; python_full_version >= '3.11'",
    "pylint==4.0.5 ; python_full_version >= '3.11'",
    "pytest>=4.6.11 ; python_full_version == '2.7.*' or python_full_version >= '3.4'",
    "pyyaml==5.3.1 ; python_full_version == '3.5.*'",
    "pyyaml==5.4.1 ; python_full_version == '2.7.*'",
    "pyyaml==6.0.1 ; python_full_version >= '3.6'",
    "restructuredtext-lint==2.0.2 ; python_full_version >= '3.11'",
    "rstcheck==6.2.5 ; python_full_version >= '3.11'",
    "rstfmt==0.0.14 ; python_full_version >= '3.11'",
    "ruamel-yaml==0.19.1 ; python_full_version >= '3.11'",
    "subprocess32==3.5.4 ; python_full_version == '2.7.*'",
    "toml==0.10.2 ; python_full_version >= '3.11'",
    "tomli==1.1.0 ; python_full_version >= '3.7' and python_full_version < '3.11'",
    "tqdm==4.64.1 ; python_full_version < '3.7'",
    "tqdm==4.66.4 ; python_full_version >= '3.7'",
    "virtualenv==16.7.10 ; python_full_version == '2.7.*'",
    "virtualenv>=16.7.10 ; python_full_version >= '3.5'",
    "wheel>=0.37.1",
    "yamllint==1.28.0 ; python_full_version >= '3.11'",
    "zstandard>=0.15 ; python_full_version >= '3.5' and python_full_version < '3.14'",
]

